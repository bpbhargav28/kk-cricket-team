name: Deploy to GitHub Pages

on:
  push:
    # This repository's default branch is `master`; `main` is included so the
    # workflow keeps working if the default branch is ever renamed.
    branches: [master, main]
  # Lets you re-deploy from the Actions tab without pushing a commit — useful
  # right after adding the Supabase secrets.
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy run as one job inside the `github-pages` environment, so
  # the build can read secrets stored on that environment (Settings →
  # Environments → github-pages) as well as repository-level secrets.
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Only the publishable (anon) key belongs here. The service-role key
          # must never be added as a VITE_ secret — it would be inlined into the
          # public bundle.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Serve from https://<owner>.github.io/<repo>/ unless a repository
          # variable overrides it (set VITE_BASE_PATH to "/" for a custom domain
          # or a <owner>.github.io repository).
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Warn if Supabase secrets are missing
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are not set (checked repository and github-pages environment secrets)."
            echo "::warning::The site will deploy but show the setup screen until you add them."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
