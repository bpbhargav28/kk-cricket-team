<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KK Cricket Team</title>
    <script>
      // Single Page Apps for GitHub Pages (github.com/rafgraph/spa-github-pages).
      // GitHub Pages has no server-side rewrite, so any deep link lands here. We encode
      // the requested path into a query string and bounce to index.html, which decodes it.
      //
      // pathSegmentsToKeep = 1 because the site is served from /<repo-name>/.
      // Set it to 0 if you ever host this at a domain root.
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body>
    Redirecting&hellip;
  </body>
</html>
